<!DOCTYPE html>
<html>
    <head>
        <!-- Custom Raw.Githack CDN link for your GitHub repository -->
        <base href="https://raw.githack.com/FALATRO/Beyond/master/www/">

        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>Beyond Demo</title>

        <!-- Mock Node.js process variable for desktop plugins -->
        <script type="text/javascript">
            if (typeof process === 'undefined') {
                window.process = { platform: 'browser', versions: {} };
            }
        </script>

        <style>
            body {
                background-color: black;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="background-color: black">
        <!-- 1. Bundled JSON Database -->
        <script type="text/javascript" src="js/data.bundle.js"></script>

        <!-- 2. Core JavaScript Libraries -->
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>

        <!-- 3. RPG Maker MV Engine Core Scripts -->
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>

        <!-- 4. Web Engine Safety & Error-Handling Patches -->
        <script type="text/javascript">
            // Global CORS Patch: Force anonymous crossOrigin on every image created
            (function() {
                var descriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(HTMLImageElement.prototype, 'src', {
                        set: function(url) {
                            if (!this.crossOrigin) {
                                this.crossOrigin = 'anonymous';
                            }
                            descriptor.set.call(this, url);
                        },
                        get: function() {
                            return descriptor.get.call(this);
                        }
                    });
                }
            })();

            // Patch A: Catch Gamepad Permission Errors
            if (typeof Input !== 'undefined') {
                Input._pollGamepads = function() {
                    if (navigator.getGamepads) {
                        try {
                            var gamepads = navigator.getGamepads();
                            if (gamepads) {
                                for (var i = 0; i < gamepads.length; i++) {
                                    var gp = gamepads[i];
                                    if (gp && gp.connected) this._updateGamepadState(gp);
                                }
                            }
                        } catch (e) {}
                    }
                };
            }

            // Patch B: Safe DataManager Override with Recursion Guard
            if (typeof DataManager !== 'undefined') {
                var _origLoadData = DataManager.loadDataFile;
                var _bypassing = false;
                DataManager.loadDataFile = function(name, src) {
                    if (window.$dataBundled && window.$dataBundled[src]) {
                        window[name] = window.$dataBundled[src];
                        this.onLoad(window[name]);
                        return;
                    }
                    if (!_bypassing) {
                        _bypassing = true;
                        _origLoadData.call(this, name, src);
                        _bypassing = false;
                    }
                };
            }

            // Patch C: Prevent Canvas Crashes on Broken/Loading Images
            if (typeof Graphics !== 'undefined') {
                var _paintUpper = Graphics._paintUpperCanvas;
                Graphics._paintUpperCanvas = function() {
                    try { _paintUpper.call(this); } catch (e) {}
                };
            }

            // Patch D: Intercept and neutralize MadeWithMv splash screen
            if (typeof ImageManager !== 'undefined') {
                var _loadSys = ImageManager.loadSystem;
                ImageManager.loadSystem = function(filename) {
                    if (filename === 'MadeWithMv') return this.loadEmptyBitmap();
                    return _loadSys.call(this, filename);
                };
            }

            // Patch E: Fallback for Bitmap.getPixel
            if (typeof Bitmap !== 'undefined') {
                var _getPixel = Bitmap.prototype.getPixel;
                Bitmap.prototype.getPixel = function(x, y) {
                    try { return _getPixel.call(this, x, y); } catch (e) { return '#ffffff'; }
                };
            }

            // Patch F: Responsive Aspect Ratio Scaler
            function applycanvasmode() {
                var canvas = document.querySelector("#GameCanvas");
                var video = document.querySelector("#GameVideo");
                var upperCanvas = document.querySelector("#UpperCanvas");
                if (!canvas) return;
                var maxW = window.innerWidth, maxH = window.innerHeight;
                var w = maxW, h = maxH;
                if (maxW * 0.75 > maxH) {
                    h = maxH; w = Math.floor(maxH / 3 * 4);
                } else {
                    w = maxW; h = Math.floor(maxW / 4 * 3);
                }
                canvas.style.width = w + "px"; canvas.style.height = h + "px";
                if (video) { video.style.width = w + "px"; video.style.height = h + "px"; }
                if (upperCanvas) { upperCanvas.style.width = w + "px"; upperCanvas.style.height = h + "px"; }
            }
            setInterval(applycanvasmode, 100);
        </script>

        <!-- 5. Main Game Boot Script -->
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
